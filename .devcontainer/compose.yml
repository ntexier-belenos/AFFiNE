name: affine_dev_services
services:
  affine:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    container_name: affine_server_dev
    env_file:
      - .env
    ports:
      - '${PORT:-3010}:3010'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    volumes:
      - ..:/workspaces/AFFiNE:delegated
    command: sleep infinity
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      - NODE_OPTIONS=--max-old-space-size=4096

  postgres:
    env_file: .env
    image: pgvector/pgvector:pg${DB_VERSION:-16}
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD',
          'pg_isready',
          '-U',
          '${DB_USERNAME}',
          '-d',
          '${DB_DATABASE_NAME:-affine}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - 1025:1025
      - 8025:8025

  # https://manual.manticoresearch.com/Starting_the_server/Docker
  manticoresearch:
    image: manticoresearch/manticore:${MANTICORE_VERSION:-9.2.14}
    restart: always
    ports:
      - 9308:9308
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - manticoresearch_data:/var/lib/manticore

networks:
  dev:

volumes:
  postgres_data:
  manticoresearch_data:
